name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python3 -m py_compile server.py

      - name: Datos y sitio estático
        run: |
          test -f frases.csv
          test -f libros.jsonl
          test -d public
          test -f public/index.html

      - name: JSONL válido (primera línea)
        run: head -1 libros.jsonl | python3 -c "import json,sys; json.loads(sys.stdin.read())"
